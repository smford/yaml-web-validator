version: 2
updates:
  # Automated dependency maintenance for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      codemirror-ecosystem:
        patterns:
          - "@codemirror/*"
          - "@uiw/react-codemirror"
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
      build-and-lint:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "vitest*"
          - "typescript"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"

  # Automated dependency maintenance for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "actions/*"
