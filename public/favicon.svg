<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="yc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="yc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="yc-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="yc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="32" height="32" rx="7.5" fill="url(#yc-bg)" stroke="#27272a" stroke-width="1.2" />

  <!-- Inner YAML Document outline -->
  <rect x="7" y="8" width="12" height="15" rx="2" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.2" />
  
  <!-- Indented YAML lines -->
  <line x1="9.5" y1="12" x2="13.5" y2="12" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round" />
  <line x1="11.5" y1="15" x2="16" y2="15" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round" />
  <line x1="11.5" y1="18" x2="14" y2="18" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round" />

  <!-- Anchor Motif -->
  <!-- Top Ring -->
  <circle cx="16" cy="6" r="2" stroke="url(#yc-accent)" stroke-width="1.6" />
  <!-- Center Shaft -->
  <line x1="16" y1="8" x2="16" y2="24.5" stroke="url(#yc-accent)" stroke-width="1.8" stroke-linecap="round" />
  <!-- Curved Flukes -->
  <path d="M7 19.5 C7.5 25.5 12.5 27 16 27 C19.5 27 24.5 25.5 25 19.5" stroke="url(#yc-accent)" stroke-width="1.8" stroke-linecap="round" />
  <!-- Left Arrowhead -->
  <path d="M5.5 21 L7 18.5 L8.5 21" stroke="url(#yc-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Arrowhead -->
  <path d="M23.5 21 L25 18.5 L26.5 21" stroke="url(#yc-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Clean Validation Checkmark -->
  <path d="M15.5 15 L19.5 19 L27 8.5" stroke="url(#yc-check)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#yc-glow)" />
</svg>
